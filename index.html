<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F4F1EA" />
    <title>符文档案 · 周报 — Riftbound 城市赛 Meta 情报</title>
    <meta
      name="description"
      content="符文档案 · 周报:Riftbound(符文战场)城市挑战赛 Meta 情报,支持单周或多周数据包。英雄 Tier、传奇域对、万金油单卡、Combo 羁绊、地域地图与卡组浏览器。"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23F4F1EA'/%3E%3Cpath d='M16 5.5l8.5 10.5L16 26.5 7.5 16z' fill='none' stroke='%23B23A27' stroke-width='2.2'/%3E%3Cpath d='M16 11l4 5-4 5-4-5z' fill='%23C59B46'/%3E%3C/svg%3E"
    />

    <!--
      字体:Noto Serif SC(中文衬线·档案/刊印感)+ Cinzel(拉丁铭文感)。
      离线时自动回退到系统衬线(Songti SC / SimSun / Georgia),不影响功能。
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Noto+Serif+SC:wght@600;700;900&display=swap"
      rel="stylesheet"
    />

    <!--
      中国地图数据(从 DataV GeoAtlas 离线打包,放在 public/china-geo.js):
      使用绝对路径以便 Vite 把文件原样拷贝到 dist/(不作 bundle 也不需要 type="module"),
      保证 file:// 协议下脚本能同步执行、window.chinaGeoJson 在 Vue mount 之前已就绪。
    -->
    <script src="/china-geo.js"></script>
  </head>
  <body class="min-h-screen">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
